
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DCT Custom XAUUSD Chart</title>

  <script src="https://unpkg.com/lightweight-charts@5.0.8/dist/lightweight-charts.standalone.production.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #FFFFFF;
      font-family: Arial, sans-serif;
    }

    #chart {
      width: 100%;
      height: calc(100vh - 32px);
    }

    .attribution {
      height: 32px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 11px;
    }

    .attribution a {
      color: #2962FF;
      text-decoration: none;
    }
  </style>
</head>

<body>

  <div id="chart"></div>

  <div class="attribution">
    <a href="https://www.tradingview.com/" target="_blank">
      Charting by TradingView
    </a>
  </div>

  <script>
    const chartElement = document.getElementById('chart');

    const chart = LightweightCharts.createChart(chartElement, {
      autoSize: true,

      layout: {
        background: { color: '#FFFFFF' },
        textColor: '#000000'
      },

      grid: {
        vertLines: { color: '#EEEEEE' },
        horzLines: { color: '#EEEEEE' }
      },

      rightPriceScale: {
        borderColor: '#000000'
      },

      timeScale: {
        borderColor: '#000000',
        timeVisible: true
      }
    });

    const candles = chart.addSeries(
      LightweightCharts.CandlestickSeries,
      {
        upColor: '#FFFFFF',
        downColor: '#000000',
        borderUpColor: '#000000',
        borderDownColor: '#000000',
        wickUpColor: '#000000',
        wickDownColor: '#000000'
      }
    );

    // Real XAUUSD market data will be connected here.
    // Do not insert sample prices.

    const status = document.createElement('div');
    status.textContent = 'Waiting for XAUUSD market data connection';
    status.style.cssText =
      'position:absolute;top:12px;left:12px;color:#666;font-size:12px;';
    document.body.appendChild(status);

  </script>

</body>
</html>
